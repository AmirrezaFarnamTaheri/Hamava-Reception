global:
  scrape_interval: 15s
rule_files: [prometheus-alerts.yml]
scrape_configs:
  - job_name: hamava
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
    authorization:
      type: Bearer
      credentials_file: /run/secrets/hamava_metrics_token
# Configure an approved Alertmanager destination and staffed escalation roster.
# This example deliberately contains no external recipient or credentials.
