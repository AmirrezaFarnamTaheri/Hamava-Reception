; Deliberately incomplete carrier template. Obtain exact realm, IPs, credentials,
; codec, TLS/SRTP and DID policies from the contracted carrier. Do not expose an
; anonymous SIP endpoint or install guessed credentials.

[approved-carrier]
type=endpoint
transport=YOUR_REVIEWED_TRANSPORT
context=hamava-inbound
disallow=all
allow=alaw,ulaw
aors=approved-carrier-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[approved-carrier-aor]
type=aor
contact=sip:YOUR_CARRIER_HOST

[approved-carrier-identify]
type=identify
endpoint=approved-carrier
match=YOUR_CONTRACTED_CARRIER_CIDR

; Authentication, registration, TLS certificates and SRTP parameters are
; carrier-specific. The deployment runbook requires their real UAT evidence.
