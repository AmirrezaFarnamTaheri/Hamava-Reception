; Include only in an authenticated carrier's inbound context. No public outbound
; dial prefix or toll route is provided. Replace the DID and staff endpoint.
; The example proves BUSY/NOANSWER by trying the actual staff endpoint first.
; hamava_register.py must run after the operator-approved processing notice.

[hamava-inbound]
exten => YOUR_AUTHORIZED_DID,1,NoOp(Hamava authorized inbound reception)
 same => n,Set(HAMAVA_DID=YOUR_AUTHORIZED_DID)
 ; An explicit local fallback remains available if registration/API fails.
 same => n,Set(HAMAVA_TRANSFER_TARGET=PJSIP/approved-reception)
 same => n,Set(HAMAVA_QUEUE=reception)
 same => n,Dial(${HAMAVA_TRANSFER_TARGET},20)
 same => n,GotoIf($["${DIALSTATUS}"="ANSWER"]?done)
 same => n,Set(HAMAVA_REASON=incoming)
 same => n,ExecIf($["${DIALSTATUS}"="BUSY"]?Set(HAMAVA_REASON=busy))
 same => n,ExecIf($["${DIALSTATUS}"="NOANSWER"]?Set(HAMAVA_REASON=no_answer))
 same => n,Answer()
 same => n,Playback(custom/hamava-processing-notice)
 same => n,GotoIf($["${PLAYBACKSTATUS}"!="SUCCESS"]?human)
 same => n,AGI(hamava_register.py,${HAMAVA_DID},${HAMAVA_REASON},${CHANNEL(linkedid)},${CHANNEL(uniqueid)})
 same => n,GotoIf($["${HAMAVA_REGISTERED}"!="1"]?human)
 ; Relay correlates authenticated AMI events via this registration announcement.
 same => n,UserEvent(HamavaRegistered,CallUUID:${HAMAVA_UUID},Linkedid:${CHANNEL(linkedid)},CallerUniqueid:${CHANNEL(uniqueid)})
 same => n,AudioSocket(${HAMAVA_UUID},127.0.0.1:9092)
 ; Socket completion/AI handoff falls back here. This is a cold return to the
 ; staff route, not a claim that a human has already joined the call.
 ; The AGI accepts a configured destination only if the PBX's separate
 ; HUMAN_TRANSFER_TARGETS allowlist agrees with the API's versioned route.
 ; The caller remains outside the staff channel until the staff member
 ; explicitly presses 1. Never turn an unanswered phone into a "connected"
 ; reception report. Requires app_read, app_dial, func_channel, and a
 ; locally provisioned, reviewed custom/hamava-screened-offer recording.
 same => n(human),Set(HAMAVA_STAFF_SCREENED=0)
 same => n,Dial(${HAMAVA_TRANSFER_TARGET},25,U(hamava-screened^${HAMAVA_UUID}))
 same => n,GotoIf($["${HAMAVA_STAFF_SCREENED}"="1"]?done:unavailable)
 same => n(unavailable),Playback(custom/hamava-staff-unavailable)
 same => n(done),Hangup()

; Called staff leg only. Asterisk Dial U() runs this BEFORE the PBX bridges
; the staff to the caller. A plain Dial answer is NOT staff consent.
[hamava-screened]
exten => s,1,NoOp(Private pre-bridge staff acceptance)
 same => n,Set(HAMAVA_SCREEN_DIGIT=)
 same => n,Read(HAMAVA_SCREEN_DIGIT,custom/hamava-screened-offer,1,,1,8)
 same => n,GotoIf($["${READSTATUS}"="OK" & "${HAMAVA_SCREEN_DIGIT}"="1"]?accept:decline)
 same => n(accept),Set(MASTER_CHANNEL(HAMAVA_STAFF_SCREENED)=1)
 same => n,UserEvent(HamavaStaffAccepted,CallUUID:${ARG1},Linkedid:${CHANNEL(linkedid)},StaffUniqueid:${CHANNEL(uniqueid)},StaffChannel:${CHANNEL(name)})
 same => n,Return()
 same => n(decline),UserEvent(HamavaStaffDeclined,CallUUID:${ARG1},Linkedid:${CHANNEL(linkedid)},StaffUniqueid:${CHANNEL(uniqueid)},StaffChannel:${CHANNEL(name)})
 same => n,Set(GOSUB_RESULT=CONTINUE)
 same => n,Return()
