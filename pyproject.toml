[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "hamava-receptionist"
version = "0.2.2"
description = "Persian clinic reception with transactional scheduling and accountable voice workflows"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.161.1", "uvicorn[standard]==0.54.0", "SQLAlchemy==2.0.55",
  "httpx==0.28.1", "PyJWT==2.15.1", "argon2-cffi==25.1.0",
  "cryptography==50.0.2", "jdatetime==5.3.0", "psycopg[binary]==3.3.6",
  "python-multipart==0.0.32"
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.2"]
media = ["livekit==1.1.21", "livekit-api==1.2.2"]
speech = ["faster-whisper==1.2.1", "piper-tts==1.8.0"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["receptionist*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
filterwarnings = ["ignore:'audioop' is deprecated:DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

